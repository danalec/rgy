[package]
name = "rgxy"
version = "0.1.10"
edition = "2024"
rust-version = "1.89"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "rgxy: the floating launcher for the rgy search daemon"
license = "Apache-2.0"
repository = "https://github.com/danalec/rgy"
homepage = "https://github.com/danalec/rgy"
documentation = "https://docs.rs/rgxy"
keywords = ["search", "launcher", "gui", "daemon"]
categories = ["gui", "command-line-utilities"]
readme = "../../README.md"

# The package and the program carry the same name. `rgxy` is the house's
# front -- the only front there is -- and the rule that puts it there is a
# naming rule with three prefixes: the upstream's crates keep the upstream's
# names (`rgx-*`), the backend is `rgy-*`, and what the user runs is `rgxy`.
# The binary was always `rgxy`; the package now says it too, so the registry
# and the program say one thing.
# The EGM.md contracts are tracked working documents, not source. A
# tracked file under this crate would otherwise be carried into the
# published crate by cargo package (see tests/egm_packaging.rs).
exclude = ["**/EGM.md"]

[[bin]]
name = "rgxy"
path = "src/main.rs"

[dependencies]
# The launcher's model: the query, the rows, the actions, the geometry.
rgy-launcher = { path = "../../crates/launcher", version = "0.1.10" }
# The client of the daemon, and the rule that says where the daemon is.
rgy-proto = { path = "../../crates/proto", version = "0.1.10" }
# The terminal interface, for the machine that has no desktop.
rgy-search-ui = { path = "../search-ui", version = "0.1.10" }
# The console's UTF-8 code page: the name is the product.
rgy-engine = { path = "../../crates/engine", version = "0.1.10" }
# The picker: the results handed to the user's own fzf, the same way
# `searchctl` hands them over.
rgy-pick = { path = "../../crates/pick", version = "0.1.10" }

# The window is a platform thing, and it only exists on the platforms that
# have one. The binary is the same everywhere: the launcher falls back to
# the terminal where there is no desktop. Both backends export the SAME
# interface, so the window driver in src/gui.rs is one driver reached
# through src/platform.rs. Linux and FreeBSD share the X11 backend.
[target.'cfg(windows)'.dependencies]
rgy-launcher-windows = { path = "../../crates/launcher-windows", version = "0.1.10" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
rgy-launcher-x11 = { path = "../../crates/launcher-x11", version = "0.1.10" }
