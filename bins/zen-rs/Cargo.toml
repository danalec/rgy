[package]
name = "zen-rs"
version = "0.1.0"
edition = "2024"
description = "The zen-rs CLI/TUI, unchanged behaviour, now built on the rgy workspace crates"
license = "Apache-2.0"

[[bin]]
name = "zen-rs"
path = "src/main.rs"

[dependencies]
name-core = { path = "../../crates/name-core" }
discovery = { path = "../../crates/discovery" }
discovery-windows = { path = "../../crates/discovery-windows" }
search-ui = { path = "../search-ui" }
# One allocator story (plan 4.4/4.10): mimalloc for the general heap, the
# same as searchctl/searchd. Transparent -- identical results, just a faster
# heap for the parallel MFT/USN walks.
mimalloc = { version = "0.1", default-features = false }
