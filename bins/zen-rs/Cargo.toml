[package]
name = "rgy-zen"
version = "0.1.9"
edition = "2024"
rust-version = "1.89"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "The zen-rs CLI/TUI, unchanged behaviour, now built on the rgy workspace crates"
license = "Apache-2.0"
repository = "https://github.com/danalec/rgy"
homepage = "https://github.com/danalec/rgy"
documentation = "https://docs.rs/rgy-zen"
keywords = ["search", "cli", "tui"]
categories = ["command-line-utilities"]
readme = "../../README.md"


[[bin]]
name = "zen-rs"
path = "src/main.rs"

[dependencies]
rgy-name-core = { path = "../../crates/name-core", version = "0.1.9" }
rgy-discovery = { path = "../../crates/discovery", version = "0.1.9" }
rgy-discovery-windows = { path = "../../crates/discovery-windows", version = "0.1.9" }
rgy-search-ui = { path = "../search-ui", version = "0.1.9" }
# The console's text: a path that cannot be spelled is said out loud.
rgy-engine = { path = "../../crates/engine", version = "0.1.9" }
# The rule of the line format: a path that carries a line break is not
# one line, and the ones left out are counted and said out loud.
rgy-pick = { path = "../../crates/pick", version = "0.1.9" }
# One allocator story (plan 4.4/4.10): mimalloc for the general heap, the
# same as searchctl/searchd. Transparent -- identical results, just a faster
# heap for the parallel MFT/USN walks.
mimalloc = { version = "0.1", default-features = false }
