[package]
name = "rgy-searchd"
version = "0.1.10"
edition = "2024"
rust-version = "1.89"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "The merged search daemon: JSON-lines over stdio/pipe/UDS, plus the rgx --serve front"
license = "Apache-2.0"
repository = "https://github.com/danalec/rgy"
homepage = "https://github.com/danalec/rgy"
documentation = "https://docs.rs/rgy-searchd"
keywords = ["search", "daemon", "filesystem"]
categories = ["command-line-utilities"]
readme = "../../README.md"


# The EGM.md contracts are tracked working documents, not source. A
# tracked file under this crate would otherwise be carried into the
# published crate by cargo package (see tests/egm_packaging.rs).
exclude = ["**/EGM.md"]

[[bin]]
name = "searchd"
path = "src/main.rs"

[dependencies]
rgy-discovery = { path = "../../crates/discovery", version = "0.1.10" }
# The platform walk selector.
rgy-discovery-dispatch = { path = "../../crates/discovery-dispatch", version = "0.1.10" }
rgy-engine = { path = "../../crates/engine", version = "0.1.10" }
rgy-name-core = { path = "../../crates/name-core", version = "0.1.10" }
# The parallelism's width: the user picks it, the environment can override
# it, and every parallel path in the daemon agrees on it.
rgy-par = { path = "../../crates/par", version = "0.1.10" }
rgy-proto = { path = "../../crates/proto", version = "0.1.10" }
# rgx --serve front reads argv arrays with rgx's own JSON parser.
rgx-core = { path = "../../crates/rgx-core", version = "0.1.10", package = "rgy-vendored-core" }
# The adapter registry: the formats a search can read *into* — a PDF, a
# .docx, a zip, a mail file. This is the second layer of the launcher, and
# the reason the vendored adapters are here.
rgy-adapters = { path = "../../crates/adapters", version = "0.1.10" }
# One allocator story (plan 4.4): mimalloc for the general heap —
# MSVCRT's HeapAlloc serialises the parallel content readers on Windows.
mimalloc = { version = "0.1", default-features = false }

# Platform live-change feeds (the Watch): each crate implements
# `rgy_discovery::Watch` for its OS. Pulled in per-platform so `open_watch` can
# build the right one.
[target.'cfg(windows)'.dependencies]
rgy-discovery-windows = { path = "../../crates/discovery-windows", version = "0.1.10" }

[target.'cfg(target_os = "linux")'.dependencies]
rgy-discovery-linux = { path = "../../crates/discovery-linux", version = "0.1.10" }

[target.'cfg(target_os = "macos")'.dependencies]
rgy-discovery-macos = { path = "../../crates/discovery-macos", version = "0.1.10" }
