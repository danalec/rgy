[package]
name = "searchd"
version = "0.1.0"
edition = "2024"
description = "The merged search daemon: JSON-lines over stdio/pipe/UDS, plus the rgx --serve front"
license = "MIT OR Apache-2.0"

[[bin]]
name = "searchd"
path = "src/main.rs"

[dependencies]
discovery = { path = "../../crates/discovery" }
# The platform walk selector (docs/freebsd-support.md P2.1).
discovery-dispatch = { path = "../../crates/discovery-dispatch" }
engine = { path = "../../crates/engine" }
name-core = { path = "../../crates/name-core" }
proto = { path = "../../crates/proto" }
# rgx --serve front reads argv arrays with rgx's own JSON parser.
rgx-core = { path = "../../crates/rgx-core" }
# One allocator story (plan 4.4): mimalloc for the general heap —
# MSVCRT's HeapAlloc serialises the parallel content readers on Windows.
mimalloc = { version = "0.1", default-features = false }

# Platform live-change feeds (the Watch): each crate implements
# `discovery::Watch` for its OS. Pulled in per-platform so `open_watch` can
# build the right one.
[target.'cfg(windows)'.dependencies]
discovery-windows = { path = "../../crates/discovery-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
discovery-linux = { path = "../../crates/discovery-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
discovery-macos = { path = "../../crates/discovery-macos" }
