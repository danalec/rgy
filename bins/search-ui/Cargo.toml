[package]
name = "rgy-search-ui"
version = "0.1.0"
edition = "2024"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "Terminal search UI (from zen-rs ui.rs; sparkline latency view)"
license = "Apache-2.0"
repository = "https://github.com/danalec/rgy"
homepage = "https://github.com/danalec/rgy"
documentation = "https://docs.rs/rgy-search-ui"
keywords = ["search", "tui", "terminal"]
categories = ["command-line-utilities"]
readme = "../../README.md"


[dependencies]
rgy-name-core = { path = "../../crates/name-core", version = "0.1.0" }
# The console's UTF-8 code page (parity row 4.7).
rgy-engine = { path = "../../crates/engine", version = "0.1.0" }
crossterm = "0.28.1"

[dev-dependencies]
# Test fixtures build `rgy_discovery::walk::Listing`s for `name_index::Index::build`.
rgy-discovery = { path = "../../crates/discovery", version = "0.1.0" }
