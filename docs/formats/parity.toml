# Parity matrix source of truth (IMPLEMENTATION_PLAN.md §6.7).
#
# One row per feature, one column per OS. The README matrix is auto-generated
# from this file so it cannot rot. Legend:
#   N = native (that OS's own mechanism)
#   P = ported (shared code, platform hook)
#   D = degraded (documented limit)
#   G = gap (work required)
#   - = N/A
#
# The `notes` field carries the per-OS caveat or the trap to watch. A `G` cell
# fails CI until it is P/N or flipped to D with a linked issue and a README
# note (§6.7). Rows mirror §6.1-§6.4 of the plan.

# --- 6.1 Discovery & metadata ---
[[feature]]
id = "1.1"
name = "Full-tree enumeration"
windows = "N"
linux = "G"
macos = "N"
notes = "MFT scan (extent streaming) | getdents64 bulk walk | getattrlistbulk."

[[feature]]
id = "1.2"
name = "Live change feed"
windows = "N"
linux = "G"
macos = "N"
notes = "USN journal | inotify (recursive) | FSEvents. Granularity differs: USN/FSEvents are directory-level, inotify per-entry."

[[feature]]
id = "1.3"
name = "Restart replay (catch up while off)"
windows = "N"
linux = "G"
macos = "N"
notes = "resume from saved USN | none - no journal | FSEvents by event id. Linux has no journal to replay."

[[feature]]
id = "1.4"
name = "Feed-loss detection"
windows = "N"
linux = "N"
macos = "N"
notes = "journal wrap / stale usn | IN_Q_OVERFLOW | MUST_SCAN_SUBDIRS, USER_DROPPED, KERNEL_DROPPED. Windows and Linux map their loss signal to Rescan; the macOS flags are in the tree, but its watch is not wired into the daemon yet (searchd's open_watch says why)."

[[feature]]
id = "1.5"
name = "Partial rescan (scope, not whole disk)"
windows = "N"
linux = "P"
macos = "N"
notes = "per-record rescan | subtree walk on Rescan | reliable replay by id."

[[feature]]
id = "1.6"
name = "Permission-denied handling"
windows = "P"
linux = "P"
macos = "P"
notes = "skip + skipped list (ACL) | EACCES skip + list | TCC/gated skip. Never prompt from the daemon."

[[feature]]
id = "1.7"
name = "Lazy/placeholder files"
windows = "G"
linux = "D"
macos = "N"
notes = "OneDrive/Cloud Files (do not hydrate) | sparse/fscrypt visible as normal | no_materialize (iCloud dataless fails fast). Windows needs the same never-hydrate guard fsearch has for iCloud."

[[feature]]
id = "1.8"
name = "Multi-volume / multi-root"
windows = "N"
linux = "P"
macos = "P"
notes = "one name index per volume | mount table + root set | mounts + firmlinks."

[[feature]]
id = "1.9"
name = "Hard links & aliases"
windows = "N"
linux = "P"
macos = "P"
notes = "hardlinks + 8.3 short names | hardlinks | hardlinks + firmlinks + symlinks."

[[feature]]
id = "1.10"
name = "Symlinks"
windows = "N"
linux = "G"
macos = "P"
notes = "reparse points (type:link) | O_NOFOLLOW walk + link entries | KIND_LINK, not crossed. Classify, do not unify blindly (Windows reparse vs POSIX symlink)."

[[feature]]
id = "1.11"
name = "Case sensitivity of the FS"
windows = "D"
linux = "G"
macos = "D"
notes = "case-insensitive (NTFS default) | case-sensitive (ext4/btrfs) | case-insensitive (APFS default). The biggest semantic parity trap - see 6.6."

[[feature]]
id = "1.12"
name = "Path encoding"
windows = "P"
linux = "P"
macos = "G"
notes = "UTF-16 native -> UTF-8 at the boundary | byte paths (locale/UTF-8) | Unicode NFD filenames. macOS stores NFD; queries typed in NFC must match (needs a folding layer, 6.6)."

[[feature]]
id = "1.13"
name = "Path separator"
windows = "D"
linux = "P"
macos = "P"
notes = "backslash | slash | slash. Internal storage normalizes to / (live::normalize / openable / rel_of); only the Win32 boundary converts."

[[feature]]
id = "1.14"
name = "Long paths"
windows = "P"
linux = "N"
macos = "D"
notes = "\\\\?\\ prefix | 4096-byte paths | 1024-byte PATH_MAX. macOS limit is real; deep trees need relative-open walking (openat-style) there too."

[[feature]]
id = "1.15"
name = "mtime/size/kind metadata"
windows = "G"
linux = "G"
macos = "N"
notes = "parse $STANDARD_INFORMATION | statx | getattrlistbulk already returns it."

[[feature]]
id = "1.16"
name = "Sparse/extent awareness"
windows = "N"
linux = "D"
macos = "D"
notes = "MFT runlists (scan) | FIEMAP optional | SEEK_HOLE optional."

