# The Listary parity matrix: what Listary does that rgy does not.
#
# Source of truth for docs/listary-parity.md, auto-generated by
# scripts/listary-parity.py so it cannot rot. One row per capability
# recovered from the reverse engineering of Listary 7.1.0.45
# (E:\listari-rea\REVERSE_ENGINEERING_REPORT.md), one column per side.
#
# This is the implementation plan, and its scope is the **engine's
# performance**: the ranking machinery, the matchers, the priority, the
# query surface, the index shape and pinyin. The product surface Listary
# also has -- the HTTP API, the suggestion sources, the index schedule,
# the diagnostics -- is out of scope: it is features, not performance, and
# it is recorded in the report rather than here.
#
# The work field of every G and D row says what the change is in rgy's
# terms and where it lands; the phase field says when. The phases run
# in order, and the order is a dependency order, not a preference.#
# Legend:
#   P = parity      (rgy has it; the `rgy` field says where)
#   D = degraded    (rgy has a weaker version; the `work` field says how)
#   G = gap         (rgy has nothing; the `work` field says what to build)
#
# The gate (scripts/listary-parity.py --check, run by CI) fails when:
#   * the committed docs/listary-parity.md is not what this file renders;
#   * a row has no status, phase, size or evidence;
#   * a G or D row has no `work` -- a gap without a plan is a gap nobody
#     has scheduled;
#   * a P row has no `rgy` -- a parity claim without a place in the code
#     is a claim, not a fact;
#   * the phases are not contiguous from 1 -- a phase with no rows is a
#     phase nobody wrote.
#
# A row is not a wish. Every row cites the section of the report that
# established it, and the residual unknowns of that report are recorded
# at the end, so a row that rests on an inference says so.

[meta]
# The report the rows are read from. It is not in this repository: it is
# the reverse engineering of a proprietary binary, and the honest thing
# about it is that it is inference, not source.
report = "E:\\listari-rea\\REVERSE_ENGINEERING_REPORT.md"
# The report's own verification: 24/24 quantitative claims re-derived from
# the artefact by _analysis/verify.py.
verification = "24/24 quantitative claims re-derived from the artefact"

# The phases, and the order they run in. The order is a dependency order.
#
# Phase 3 before phase 5 is deliberate and inverted: the priority rules
# need the parent chain, and the parent chain is index work. The rule
# resolution (P.3) is therefore written against an interface that phase 5
# then implements -- and the row says so.
[phases]
1 = { title = "The rank key", why = "Listary's ranking is a packed 64-bit composite. Every other ranking change follows from that one decision, so it goes first." }
2 = { title = "The matchers, and the spans they return", why = "Six matchers instead of one, and the positions they matched. The spans are what makes a match visible, and everything that shows a result depends on them." }
3 = { title = "The priority rules", why = "The priority stops being a table in the source and becomes a rule system the user writes. It depends on the parent chain from phase 5, which is why it is written before it is implemented." }
4 = { title = "The query surface", why = "The grammar, the relative time facets and the replay path. The replay path depends on the incremental session from phase 2." }
5 = { title = "The index shape", why = "Five indexes over a validated parent-chain forest. The on-disk format stays rgy's own: the format is Listary's choice, not a capability." }
6 = { title = "Pinyin and the Japanese scripts", why = "The matcher family and the data behind it. The data is rebuilt from the UCD's Unihan readings, because cnmatch.bin is a legacy artefact the current engine does not read. The Japanese scripts ride on the same shadow: a name read in romaji, in kana or in pinyin is the same mechanism." }


# ---------------------------------------------------------------------------
# Phase 1 -- the rank key
#
# Listary's ranking is a packed 64-bit composite, not a float and not a
# tuple. Everything in this phase is a consequence of that one decision.
# ---------------------------------------------------------------------------

[[capability]]
id = "S.1"
name = "Packed 64-bit rank key"
phase = 1
status = "P"
evidence = "§5.3, §5.8.1"
listary = "The final ranking key is a bit-packed u64: a 24-bit score field biased by 2^23, a 13-bit fractional field, byte-aligned sub-fields and flag bits."
rgy = "Done. The ranking key is one u64 and the final order is its order: the key carries the priority tier in its high bits, the score in a 23-bit field biased by 2^22, and the entry's index as the tie-break in 32 bits (`crates/name-core/src/rank.rs`). The top-K selection already compared one u64, so the mechanism was there; what had not caught up was the final order, and that is now the key. The score's field is 23 bits and not Listary's 24 so that the entry's index keeps all 32 of them: a mask on the hot path is an instruction the whole scan pays for every candidate."
work = "None. The layout is rgy's own -- the report says the weights are bit positions it could not tabulate (§10.2), so what came from it is the shape, not the bits. It costs 6% to 9% of the scan (measured, 9 runs at one thread, before and after on the same host): the tier has to be read per candidate and compared above the score, and a key that is not a tuple cannot skip that."
size = "M"

[[capability]]
id = "S.2"
name = "Fixed-point score with 13 fractional bits"
phase = 1
status = "D"
evidence = "§5.8.1"
listary = "The score is fixed-point with 13 fractional bits and is quantised before comparison: ceil(x / 8192), computed as the shifted fraction plus the carry unless the fraction was exactly zero."
rgy = "The score is a fixed-point value with 13 fractional bits (`rank::Score`), and the key quantises it with the same ceiling Listary computes. The fraction is zero today, because rgy's matchers score in whole points; the type is there for an axis that carries a fractional weight."
work = "An axis that carries a fractional weight, so the fraction is something other than zero: the rules of phase 3 are the first candidate."
size = "S"

[[capability]]
id = "S.3"
name = "Six-level priority ladder"
phase = 1
status = "P"
evidence = "§4.6"
listary = "Ignored < Low < Normal < Internal < High < HighFile, a discriminated enum with a bit-packed representation."
rgy = "Done. The ladder is `rank::Tier`, six levels, and the tier is in the high bits of the ranking key -- a priority that is only a term added to the score loses to a better name, and the ranking corpus (`crates/name-core/tests/ranking.rs`) is the instrument that says so. The path tier comes from the location prior the entry inherits from its directory, and it rides in the kind byte the search reads anyway; the name and attribute tiers are `Normal` until the rules of phase 3 set them."
work = "None for the ladder. The rules that set the tiers are phase 3 (P.1 to P.4). The tier is read from the index rather than computed: computing it cost 13% of the scan, because the prior it comes from is a load and the tier is a chain of compares on top of it."
size = "S"

[[capability]]
id = "S.4"
name = "Per-axis weights (path, attribute, name)"
phase = 1
status = "D"
evidence = "§4.6, §5.8.1"
listary = "Priority is applied on three independent axes, each with a search weight and a sort weight: search_path_priority / sort_path_priority, search_attribute_priority / sort_attribute_priority, search_name_priority / sort_name_priority."
rgy = "The sort weight is there: the key has a tier field per axis (path, name, attribute), and the field's position in the key is its weight -- the high bits, so the path decides first. The search weight is not: no axis is `Ignored` yet, so no candidate is dropped before it is scored."
work = "The search weight: the axis that says a candidate is not worth scoring at all. It arrives with the rules of phase 3, which are what make a tier `Ignored`."
size = "M"

[[capability]]
id = "S.5"
name = "Choice of sort key"
phase = 1
status = "G"
evidence = "§5.3"
listary = "SortBy is a choice: NoSort, Score, FileName, LastWriteTime."
rgy = "The order is fixed: score descending, then id ascending."
work = "A `SortBy` on the query, plumbed through to the final sort, with the default staying Score so nothing that works today changes."
size = "S"

# ---------------------------------------------------------------------------
# Phase 2 -- the matchers, and the spans they return
#
# Listary has six matchers; rgy has one (fuzzy) plus a typo-tolerant
# variant of it. Each matcher returns the positions it matched, which is
# what makes the highlighting possible.
# ---------------------------------------------------------------------------

[[capability]]
id = "S.6"
name = "Boyer-Moore with a SWAR memchr pre-filter"
phase = 2
status = "D"
evidence = "§5.2, §5.8.3"
listary = "A BM substring matcher whose haystack scan uses the SWAR has-zero-byte test in an 8x unrolled loop, with the alignment term `& 0x38` and a 0x100 alphabet -- memchr before the Horspool loop."
rgy = "The substring matcher (the exact mode and the phrase) searches the first byte's two cases with memchr and compares the rest. The BM's skip table is not there: it earns its keep on haystacks long enough to skip over, and a name is short -- the memchr pre-filter is the whole of the win. The names are UTF-8, so the matcher is byte-safe on non-ASCII rather than refusing it (Listary's own assertion, `pattern.is_ascii()`, is not a requirement here)."
work = "None for the capability. The BM's Horspool loop would be a slower way of doing what the pre-filter already does on a name's length."
size = "M"

[[capability]]
id = "S.7"
name = "Keyword / word-boundary matcher"
phase = 2
status = "P"
evidence = "§5.2"
listary = "A matcher that matches on word boundaries, so a query word matches a word of the name and not a fragment of it."
rgy = "Done. `=port` asks for a whole word of the name: the words are the runs between the delimiters (the same ones the scorer's boundary bonus knows), and the query has to be one of them. It is a mode, not an automatic axis: the fuzzy match already forgives what the keyword one refuses, and running both on every candidate would cost the scan a third of itself."
work = "None. The matcher is `Mode::Keyword` in `name_query.rs`, and the manual says what the marker means."
size = "S"

[[capability]]
id = "S.8"
name = "Phrase matcher"
phase = 2
status = "P"
evidence = "§5.2, §5.8.2"
listary = "An exact-phrase matcher, fed by the tokenizer's quoted-phrase token."
rgy = "Done. The tokenizer learns `\"` as a phrase delimiter: a quoted run is one token (`Mode::Phrase`) and the phrase matcher looks for the words together, in order, with the spaces between them. The old tokenizer kept the quoted run together and threw the quotes away, so `\"invoice pdf\"` was a fuzzy token with a space in it."
work = "None. The matcher is `Mode::Phrase` in `name_query.rs`, and the manual says what the quotes mean."
size = "S"

[[capability]]
id = "S.9"
name = "Matched-position bitmap"
phase = 2
status = "P"
evidence = "§5.2, §5.5"
listary = "Every matcher returns the positions it matched as a bitmap, and the fuzzy matcher works on character boundaries rather than bytes -- so the UI can highlight the span that earned the score."
rgy = "Done. The matchers return the characters they matched (`name_query::matched_chars`), and the CLI's `--json` carries them as a `match` array while the TUI paints the span in the highlight's colour. The matcher works on bytes -- rgy's index is bytes -- so the bytes it matched are snapped to the characters they belong to: a character is matched whole or not at all. A name that matched through a typo, or through its shadow, has no positions: the span would be in another text."
work = "None. The positions are computed on demand, for the rows that are shown; the scan does not carry them, so the hot path does not pay for them."
size = "M"

[[capability]]
id = "S.10"
name = "Incremental re-ranking on query edit"
phase = 2
status = "G"
evidence = "§5.4, §5.5"
listary = "When the query is edited, the executor reuses the previous result set and the previous state instead of re-scanning the index -- a keystroke-latency optimisation, keyed by an incremental-search session id."
rgy = "Every query is a fresh scan. The daemon keeps the index warm, but a changed query re-walks it."
work = "A session in the engine that keeps the last result set and re-ranks it when the query changes, with the incremental-search id as the key. This is the single biggest latency win in the list, and it is also the most invasive: it needs a session object with a revision, and the executor has to be able to re-rank without re-scanning."
size = "L"

# ---------------------------------------------------------------------------
# Phase 3 -- the priority rules
#
# Listary's priority is a rule system the user writes. rgy's is a table
# in the source. These four rows are one feature: rules, resolution, and
# the exclusion that follows from them.
# ---------------------------------------------------------------------------

[[capability]]
id = "P.1"
name = "User-defined regex priority rules"
phase = 3
status = "D"
evidence = "§4.6"
listary = "Rules carry a priority, a regex, and apply_to_folders / apply_to_files, and are attached to paths. The legacy managed contract names the record `FileNameRegexPriorityRule`."
rgy = "`prior_adjust` is a hard-coded name table in the source: Applications, Library, System, node_modules, target, dot-dirs. It cannot be changed by the user and it does not survive an upgrade."
work = "A rules list in the configuration, each with a regex, a priority and the two apply flags, evaluated at index time. The hard-coded table becomes the first rule set, so the current behaviour is the default and not a special case."
size = "L"

[[capability]]
id = "P.2"
name = "Regex extension rules"
phase = 3
status = "G"
evidence = "§4.6"
listary = "Extension rules are regex-driven too, with the pattern `(?i)\\.(?:)$` used to detect an empty extension."
rgy = "Absent. Extensions are matched exactly, by suffix."
work = "Extension rules alongside the path rules, with the empty-extension pattern as the degenerate case."
size = "S"

[[capability]]
id = "P.3"
name = "Parent-chain resolution and rule replay"
phase = 3
status = "G"
evidence = "§4.5, §4.6"
listary = "Resolving a record's priority walks the parent chain and replays the rules; the result is then checked against the stored priority, and a broken chain is an error rather than a fallback."
rgy = "The index stores the tree as DFS ranges (`children`, `descendants`), which give the shape but not a per-record parent chain to walk."
work = "The index keeps a parent pointer per record, resolution walks it and replays the rules, and the resolved priority is compared with the stored one. This row is why the index work of phase 5 comes first in the dependency order even though it is listed later."
size = "L"

[[capability]]
id = "P.4"
name = "Ignored records are outside the live set"
phase = 3
status = "G"
evidence = "§4.5, §4.6"
listary = "Records at the Ignored tier are excluded from the live set entirely -- they are indexed but not searchable."
rgy = "Absent. There is no tier below Low, so every indexed entry is searchable."
work = "The lowest tier of the ladder drops out of the searchable set at query time. The index keeps it, so the rule can be reversed without a rescan."
size = "S"

