rgy = "The tree is implicit in the DFS ranges. There is no per-record chain to validate, and no integrity check beyond what the ranges already give."
work = "Per-record parent pointers with the four integrity checks, so a corrupt index is detected rather than read. This is the substrate P.3 resolves against."
