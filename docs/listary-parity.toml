[[capability]]
id = "J.2"
name = "A kanji read in kana"
phase = 6
status = "D"
evidence = "§6.3"
listary = "Not in Listary's data: its readings are Chinese."
rgy = "Done, with two limits. The Unihan reading of a character is used (the on-reading, or the kun-reading when there is no on-reading), so 日本語 is read ニチホンゴ rather than the word's ニホンゴ -- the fuzzy matcher skips the extra character, so `nihongo` still finds it. And a character's other readings (日 is also ひ) are not tried."
work = "The alternative readings of a character, and the compound readings of a word. The first needs the reading table to carry every reading and the matcher to try them; the second needs a word-level dictionary, which is what a Japanese IME has and the UCD does not."
size = "L"

