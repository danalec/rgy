rgy = "One flat index: interned names, DFS ranges for the tree, a name mask and per-class bitmaps. It answers a name query and a path lookup, and it does not separate files from folders in the lookup surface."
work = "Split the lookup surface into the five indexes over the same record store. The folder_backend index is the new one: it maps a name to the volume that owns it, which is what a multi-volume search needs."
size = "L"

[[capability]]
