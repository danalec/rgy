notes = "VirtualFree path | malloc_trim | no trim (drop caches manually). macOS malloc does not return aggressively -- document RSS behaviour."

[[feature]]
id = "4.12"
name = "PGO release builds"
windows = "P"
linux = "P"
macos = "P"
notes = "MSVC /GENPROFILE or gcc | -fprofile-generate/use | -fprofile-instr-generate. pgo.ps1 / pgo.sh at the repo root."

[[feature]]
id = "4.13"
name = "login-item autostart"
windows = "P"
linux = "P"
macos = "N"
notes = "startup task, falling back to HKCU Run | systemd user unit | launchd agent. crates/autostart writes all three as plain text the user can read. A logon-triggered task needs an administrator on a stock Windows session, so the tool falls back to the registry and says so. Registering is the consent: no prompt, no elevation, no dialog."

[[feature]]
id = "4.14"
name = "elevated-privilege model"
windows = "D"
linux = "N"
macos = "D"
notes = "Admin for MFT raw reads | none (walk as user) | Full Disk Access for gated folders. Per-OS consent flow in the README; never prompt from the daemon."

[[feature]]
id = "4.15"
name = "packaging / install"
windows = "P"
linux = "N"
macos = "P"
notes = "winget (danalec.rgy-search) | tarballs | brew (rgy-search). The package is called rgy-search because rgy is taken on crates.io (a GameBoy emulator library); on winget and homebrew the name is free, and one name across the registries is worth more than the shorter one. The binaries and the project keep the name rgy, and the repository is danalec/rgy. The release script builds the archives, gates on clippy and the tests, then tags and publishes to the forgejo and to GitHub. No release has been published yet, so the manifest and the formula are staged."

[[feature]]
id = "4.16"
name = "CI matrix"
windows = "P"
linux = "P"
macos = "P"
notes = "windows-latest | ubuntu-latest | macos-latest. Parity tests (6.7) run on all three."
