# Parity matrix source of truth (design.md §6).
#
# One row per feature, one column per OS. The README matrix is auto-generated
# from this file so it cannot rot. Legend:
#   N = native (that OS's own mechanism)
#   P = ported (shared code, platform hook)
#   D = degraded (documented limit)
#   G = gap (work required)
#   - = N/A
#
# The `notes` field carries the per-OS caveat or the trap to watch. A `G` cell
# fails CI until it is P/N or flipped to D with a linked issue and a README
# note (§6.7). Rows mirror §6.1-§6.4 of the plan.
#
# A cell says what the code IS. The table below says whether it has been RUN
# on that OS. The macOS column is transported and compiles, but it has never
# run on a Mac: there is no macOS machine in the loop, and the cell for it
# is a claim about the design, not about a verified behaviour.

[columns]
# Verified on the target OS: Windows (a real kernel) and Linux (a real
# kernel). macOS is not: the backend is transported, the suite has never
# run there.
verified = ["windows", "linux"]

# The gaps that are known and open, with the reason each one is still open.
#
# The gate (scripts/parity-matrix.py --check, run by CI) fails when:
#   * the committed matrix is not what this file renders;
#   * a row carries a G cell that is NOT on this list -- a new gap;
#   * a gap on this list is no longer a G cell -- it was closed, and the
#     line has to go, so the list cannot become a graveyard.
#
# A gap on this list is not a gap that is allowed to be forgotten: it is a
# gap with a name, a reason, and a place in docs/STATUS.md.

# --- 6.1 Discovery & metadata ---
[[feature]]
id = "1.1"
name = "Full-tree enumeration"
windows = "N"
linux = "P"
macos = "N"
notes = "MFT scan (extent streaming) | getdents64 bulk walk | getattrlistbulk."

[[feature]]
id = "1.2"
name = "Live change feed"
windows = "P"
linux = "P"
macos = "P"
notes = "USN journal (the feed delivers the changes; the path a record names is rebuilt from the MFT, one record per level, so the folder to re-list is known) | inotify (recursive) | FSEvents, wired into the daemon. Granularity differs: USN/FSEvents are directory-level, inotify per-entry. The macOS stream is callback-based, so an adapter turns it into a pull: a folder event re-lists that folder, and the dropped-event flags (MustScanSubDirs, KernelDropped, UserDropped) become a full rescan, because the live model cannot re-list a subtree. The feed can be wider than the tree (the Windows journal is the volume's), so a change outside the indexed tree is dropped."

[[feature]]
id = "1.3"
name = "Restart replay (catch up while off)"
windows = "D"
linux = "D"
macos = "D"
notes = "the catch-up after a restart is a relist when the saved index is older than 30 minutes, and says so; the journal resume is wired (the feed starts at the saved watermark) and the backlog reaches the index, each record's path rebuilt from the MFT so the folder to re-list is known. The relist stays the default anyway, because the read behind that path (the MFT) needs a volume handle, which needs an administrator: until the path has been walked on a real volume, the slower answer is the safe one. On Linux the limit is permanent: there is no journal to resume from, so the age policy is the only freshness rule there is, and the status answer says which one it was: replayed or relisted."

[[feature]]
id = "1.4"
name = "Feed-loss detection"
windows = "N"
linux = "N"
macos = "N"
notes = "journal wrap / stale usn | IN_Q_OVERFLOW | MUST_SCAN_SUBDIRS, USER_DROPPED, KERNEL_DROPPED. All three map their loss signal to Rescan: the journal that wrapped or was recreated, the inotify queue that overflowed, and the FSEvents flags that say the history is gone."

[[feature]]
id = "1.5"
name = "Partial rescan (scope, not whole disk)"
windows = "N"
linux = "P"
macos = "N"
notes = "per-record rescan | subtree walk on Rescan | reliable replay by id."

[[feature]]
id = "1.6"
name = "Permission-denied handling"
windows = "P"
linux = "P"
macos = "P"
notes = "skip + skipped list (ACL) | EACCES skip + list | TCC/gated skip. Never prompt from the daemon."

[[feature]]
id = "1.7"
name = "Lazy/placeholder files"
windows = "P"
linux = "P"
macos = "P"
notes = "OneDrive/Cloud Files: the recall bits are asked before the open, so a placeholder is reported as skipped and never downloaded | sparse/fscrypt visible as normal (nothing to hydrate on this OS: the holes read as the zeros they are, and fscrypt decrypts on read) | SF_DATALESS in st_flags, translated into the same vocabulary, so an iCloud dataless file is refused the way a OneDrive placeholder is (and the reader thread's materialization policy would not fetch it anyway). The guard sits at the open, not in the index: the on-disk format does not change, and a file that is really on the disk is read exactly as before."

[[feature]]
id = "1.8"
name = "Multi-volume / multi-root"
windows = "N"
linux = "P"
macos = "P"
notes = "one name index per volume | mount table + root set | mounts + firmlinks."

[[feature]]
id = "1.9"
name = "Hard links & aliases"
windows = "N"
linux = "P"
macos = "P"
notes = "hardlinks + 8.3 short names | hardlinks | hardlinks + firmlinks + symlinks."

[[feature]]
id = "1.10"
name = "Symlinks"
windows = "N"
linux = "P"
macos = "P"
notes = "reparse points (type:link) | O_NOFOLLOW walk + link entries | KIND_LINK, not crossed. Classify, do not unify blindly (Windows reparse vs POSIX symlink)."

[[feature]]
id = "1.11"
name = "Case sensitivity of the FS"
windows = "D"
linux = "D"
macos = "D"
notes = "case-insensitive (NTFS default) | case-sensitive (ext4/btrfs) | case-insensitive (APFS default). The biggest semantic parity trap - see 6.6. The smart-case policy is the documented approximation on all three: a lowercase pattern matches either case, so a case-sensitive filesystem is the one that diverges from what the user typed."

[[feature]]
id = "1.12"
name = "Path encoding"
windows = "P"
linux = "P"
macos = "P"
notes = "UTF-16 native -> UTF-8 at the boundary | byte paths (locale/UTF-8) | Unicode NFD filenames. Every comparison runs on a fold of both sides -- ASCII case fold plus Unicode NFC (UAX #15, tables generated from the UCD) -- so a name stored as NFD matches a query typed as NFC. The bytes that are displayed and opened are still the ones the filesystem gave."

[[feature]]
id = "1.13"
name = "Path separator"
windows = "D"
linux = "P"
macos = "P"
notes = "backslash | slash | slash. Internal storage normalizes to / (live::normalize / openable / rel_of); only the Win32 boundary converts."

[[feature]]
id = "1.14"
name = "Long paths"
windows = "P"
linux = "N"
macos = "D"
notes = "\\\\?\\ prefix | 4096-byte paths | 1024-byte PATH_MAX. macOS limit is real; deep trees need relative-open walking (openat-style) there too."

[[feature]]
id = "1.15"
name = "mtime/size/kind metadata"
windows = "P"
linux = "P"
macos = "N"
notes = "parse $STANDARD_INFORMATION | lstat64 per entry (statx batching is an optimisation, not the metadata) | getattrlistbulk already returns it."

[[feature]]
id = "1.16"
name = "Sparse/extent awareness"
windows = "N"
linux = "D"
macos = "D"
notes = "MFT runlists (scan) | FIEMAP optional | SEEK_HOLE optional."

