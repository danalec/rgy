# --- 6.3 Content search ---
[[feature]]
id = "3.1"
name = "Trigram + per-file bloom index"
windows = "P"
linux = "P"
macos = "P"
notes = "Pure. Path eligibility lists get per-OS hooks."

[[feature]]
id = "3.2"
name = "Content-hash dedup"
windows = "P"
linux = "P"
macos = "P"
notes = "Pure (sha256; HW accel parked on nightly - same everywhere)."

[[feature]]
id = "3.3"
name = "TV pack store + MappedStore pool"
windows = "P"
linux = "P"
macos = "P"
notes = "Already cross-platform in rgx: the pack store is rgx-core's `tv`, behind the `tv-runtime` feature (no platform hook), and the daemon reaches it through `searchd --tv-dir`."

[[feature]]
id = "3.4"
name = "rgx engine confirm (VM, SIMD prefilter, literal/hybrid/fixed)"
windows = "P"
linux = "P"
macos = "P"
notes = "Byte-mode engine is OS-neutral: the same rgx-core on every OS, with the prefilter's SIMD chosen per CPU."

[[feature]]
id = "3.5"
name = "Adapters (archive/office/pdf/media/...)"
windows = "P"
linux = "P"
macos = "P"
notes = "Pure in-process; PATH-gated ones (tesseract, soffice) behave the same - probed once, skip when absent. The families are in the tree and build on every OS; what rgy's own binaries do NOT do is read *inside* them - the search path reads bytes. That is the same on all three operating systems, so it is not a per-OS parity question: it is in docs/STATUS.md."

[[feature]]
id = "3.6"
name = "grep:/regex: smart-case"
windows = "P"
linux = "P"
macos = "P"
notes = "Case policy is the only OS-sensitive part; smart-case must respect 6.6."

[[feature]]
id = "3.7"
name = "Verify-on-disk best-first batches"
windows = "P"
linux = "P"
macos = "P"
notes = "Pure scheduling; file handles via CreateFileW / open O_NONBLOCK|O_NOFOLLOW."

[[feature]]
id = "3.8"
name = "Incremental content sync"
windows = "P"
linux = "P"
macos = "P"
notes = "USN-driven | inotify-driven | FSEvents-driven. Same worker; different feed. Linux inherits row 1.3's replay limit."

[[feature]]
id = "3.9"
name = "Text/encoding detection"
windows = "P"
linux = "P"
macos = "P"
notes = "OS-neutral (rgx encoding.rs)."

