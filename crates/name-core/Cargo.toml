[package]
name = "rgy-name-core"
version = "0.1.0"
edition = "2024"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "Name index, query filters, fuzzy ranking (fsearch engine + zen query vocabulary)"
license = "Apache-2.0 AND MIT"
repository = "https://github.com/danalec/rgy"
homepage = "https://github.com/danalec/rgy"
documentation = "https://docs.rs/rgy-name-core"
keywords = ["search", "fuzzy", "filename", "index"]
categories = ["text-processing", "filesystem"]
readme = "../../README.md"


[dependencies]
rgy-discovery = { path = "../discovery", version = "0.1.0" }
# One regex engine (§4.4): the vendored zen-rs copy is gone; `re:`
# path patterns compile through rgx-core's syntax/nfa/vm, the same engine
# the copy was taken from (Apache-2.0).
rgx-core = { path = "../rgx-core", version = "0.1.0" }
# fsearch's name index v2 mmaps its name blob (name_index.rs).
memmap2 = "0.9"
# fsearch's parallel scan/rank (name_query.rs, live.rs).
rayon = "1.12"
# fsearch's Searcher prefilter inspects regex internals (re_literals,
# path_suffixes); the zen-rs `re:` path in `index.rs` stays on rgx-core
# (one regex engine for the query layer, §4.4).
regex = "1.12"
# fsearch scorer's folded find (name_query.rs find_folded/rfind_folded).
memchr = "2.8"
# Searcher's re_literals/path_suffixes prefilter inspects regex ASTs.
regex-syntax = "0.8"

# No libc (and no new platform crates): the few Darwin/unix bits in
# content.rs declare their own `extern "C"` and ABI constants inline —
# the same pattern `without_materializing` already used for
# getiopolicy_np. rgx-core stays `no_std`; this crate is std (file I/O).
