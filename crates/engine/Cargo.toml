[package]
name = "rgy-engine"
version = "0.1.0"
edition = "2024"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "Orchestration: keep-warm, TV pack store glue"
license = "Apache-2.0"
repository = "https://github.com/danalec/rgy"
homepage = "https://github.com/danalec/rgy"
documentation = "https://docs.rs/rgy-engine"
keywords = ["search", "engine", "daemon"]
categories = ["command-line-utilities", "filesystem"]
readme = "../../README.md"


[dependencies]
rgy-discovery = { path = "../discovery", version = "0.1.0" }
rgy-name-core = { path = "../name-core", version = "0.1.0" }
# TV pack store (tv/ + tv_runtime/) as the daemon corpus store.
rgx-core = { path = "../rgx-core", version = "0.1.0", features = ["tv-runtime"] }

[[example]]
name = "name_bench"
