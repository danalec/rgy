[package]
name = "discovery-dispatch"
version = "0.1.0"
edition = "2024"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "The Source selector (docs/design.md §2.2): the native walk per platform by cfg, the portable walk elsewhere"
license = "Apache-2.0"

[dependencies]
discovery = { path = "../discovery" }
# The catch-up rule answers with the wire value the status response carries
# (`replayed` / `relisted`), so the rule and the spelling cannot drift.
proto = { path = "../proto" }

# The platform walks, pulled in per-target so `source_for` can build the
# native one on its own OS. Every crate is empty off-target.
[target.'cfg(windows)'.dependencies]
discovery-windows = { path = "../discovery-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
discovery-linux = { path = "../discovery-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
discovery-macos = { path = "../discovery-macos" }

[target.'cfg(target_os = "freebsd")'.dependencies]
discovery-freebsd = { path = "../discovery-freebsd" }
