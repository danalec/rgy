[package]
name = "rgx-adapters-office"
version = "0.1.0"
edition = "2021"
description = "rgx adapters for Office/OpenDocument/e-book containers, parsed in-process (zip + XML strip, no external tools)"
license = "MIT OR Apache-2.0"

[dependencies]
rgx-core = { path = "../rgx-core" }
# The zip reader below spends the same producer budget as the archive
# crate's own zip adapter (`budget::MemberSink`), so a `.docx` is capped by
# `-M` / RGX_MAX_MEMBER_BYTES like every other container.
rgx-adapters-archive = { path = "../rgx-adapters-archive" }
