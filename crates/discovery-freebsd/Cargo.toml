[package]
name = "rgy-discovery-freebsd"
version = "0.1.10"
edition = "2024"
rust-version = "1.89"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "FreeBSD discovery backend: getdirentries bulk walk with d_type from the dirent"
license = "Apache-2.0"
repository = "https://github.com/danalec/rgy"
homepage = "https://github.com/danalec/rgy"
documentation = "https://docs.rs/rgy-discovery-freebsd"
keywords = ["filesystem", "search"]
categories = ["filesystem"]
readme = "../../README.md"


# The EGM.md contracts are tracked working documents, not source. A
# tracked file under this crate would otherwise be carried into the
# published crate by cargo package (see tests/egm_packaging.rs).
exclude = ["**/EGM.md"]

[dependencies]
# The backend is `no_std`: the seam comes in without its `std` feature, so
# nothing here can drag the standard library in through the door.
rgy-discovery = { path = "../discovery", version = "0.1.10", default-features = false }

[dev-dependencies]
# The oracle the reader is compared against is the portable walk, which is
# `std`. The test needs it; the backend does not, and a normal build of
# this crate does not see this edge.
rgy-discovery = { path = "../discovery", version = "0.1.10", features = ["std"] }
