[workspace]
resolver = "2"
members = [
    "crates/discovery",
    "crates/name-core",
    "crates/discovery-windows",
    "crates/discovery-linux",
    "crates/discovery-macos",
    "crates/engine",
    "crates/proto",
    "crates/rgx-core",
    "crates/rar-codec",
    "crates/rgx-adapters-archive",
    "crates/rgx-adapters-office",
    "crates/rgx-adapters-threed",
    "crates/rgx-adapters-llm",
    "crates/rgx-adapters-media",
    "crates/rgx-adapters-tabular",
    "crates/rgx-adapters-docs",
    "crates/rgx-adapters-mail",
    "crates/rgx-adapters-inspect",
    "crates/rgx-adapters-pdf",
    "bins/zen-rs",
    "bins/searchctl",
    "bins/searchd",
    "bins/search-ui",
    # e2e harnesses over the user-facing bins (tests/cli.rs, tests/serve.rs).
    # The workspace root is virtual, so this lives as its own member crate.
    "tests",
]

# One workspace, thin bins, one protocol (docs/IMPLEMENTATION_PLAN.md §3).
# crates/rgx-* are transported verbatim from ../rgx; name-core and
# discovery-windows hold the zen-rs code with the RE-audit fixes.
#
# The Zen components and the Tesla Valve pack store are Apache-2.0 only;
# the rest is MIT OR Apache-2.0. See COPYING — distributing a binary that
# links either is governed by Apache-2.0.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
# rgx's measured release shape (insights-from-rgx.md): fat LTO + one
# codegen unit; pgo.sh adds the trained profile on top.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
